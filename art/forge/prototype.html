<!doctype html>
<meta charset="utf-8">
<title>Forge slice renderer prototype</title>
<style>
  html, body { margin: 0; background: #2b2b2d; }
  .stage { position: relative; width: 392px; height: 392px; margin: 24px; }
  .stage > * { position: absolute; left: 0; top: 0; }
  img.plate { width: 392px; height: 392px; }
  canvas { width: 392px; height: 392px; }
  img.medallion { width: 120px; height: 120px; left: 136px; top: 136px; }
  .icon { width: 26px; height: 26px; margin: -13px 0 0 -13px; color: var(--c); filter: drop-shadow(0 0 4px var(--c)) drop-shadow(0 0 10px var(--c)); }
  .icon svg { width: 100%; height: 100%; }
  .row { display: flex; flex-wrap: wrap; }
</style>
<div class="row" id="row"></div>
<script type="module">
// Geometry in CSS px (Blender units × 100), as in art/forge/build.py.
const R_IN = 64, R_OUT = 128, GAP = 4.5;
const SIZE = 392, DPR = 2.5;

const VERT = `#version 300 es
in vec2 pos; out vec2 v; void main() { v = pos; gl_Position = vec4(pos, 0, 1); }`;

const FRAG = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D albedo, normal, rough;
uniform float starts[24], ends[24];
uniform int count, hovered;
uniform float rIn, rOut, gap, half_;
uniform vec3 accent;

const float PI = 3.14159265;
const float BEVEL = 5.5, BORDER = 7.0, FIELD = 2.6, H = 9.0, LIFT = 6.0;
const vec3 L = normalize(vec3(-0.55, 0.62, 0.75));

float angleOf(vec2 p) { return mod(atan(p.x, p.y) + 2.0 * PI, 2.0 * PI); }   // 0 = up, clockwise

// Signed distance (px, + inside) to slice i, a ring sector with a constant joint.
float sliceDist(vec2 p, int i) {
  float r = length(p);
  float a = angleOf(p);
  float s = starts[i], e = ends[i];
  float mid = (s + e) * 0.5, hw = (e - s) * 0.5;
  float da = a - mid; da = mod(da + PI, 2.0 * PI) - PI;          // angle from the slice's middle
  float side = (hw - abs(da)) * r - gap * 0.5;                   // arc distance to the nearer side
  float dr = min(r - rIn, rOut - r);
  // Rounded corners: inside the slab the distance is the nearer edge, near a corner it bends round.
  float k = 4.0;
  if (side > k && dr > k) return min(side, dr);
  return k - length(max(vec2(k - side, k - dr), 0.0));
}

int sliceAt(vec2 p) {
  float a = angleOf(p);
  for (int i = 0; i < 24; i++) {
    if (i >= count) break;
    float s = starts[i], e = ends[i];
    float da = mod(a - s + 2.0 * PI, 2.0 * PI);
    if (da <= e - s) return i;
  }
  return -1;
}

float heightAt(vec2 p, int i) {
  float d = sliceDist(p, i);
  if (d <= 0.0) return 0.0;
  float h = smoothstep(0.0, BEVEL, d);
  h = h * h * (3.0 - 2.0 * h);
  float field = smoothstep(BORDER, BORDER + 2.2, d);               // the sunken rune field
  return H * h - FIELD * field + (i == hovered ? LIFT : 0.0);
}

void main() {
  vec2 p = v * half_;                    // px from the center, y up
  int i = sliceAt(p);
  vec2 uv = p / (2.0 * ${(R_OUT + 8).toFixed(1)}) + 0.5;
  uv.y = 1.0 - uv.y;

  if (i < 0 || sliceDist(p, i) <= 0.0) {
    // In a joint or outside the ring: the slabs' soft shadow, cast down and to the right.
    float sh = 0.0;
    for (int k = 1; k <= 6; k++) {
      vec2 q = p + vec2(1.4, -1.8) * float(k);
      int j = sliceAt(q);
      if (j >= 0 && sliceDist(q, j) > 0.0) sh += (j == hovered ? 0.24 : 0.16);
    }
    float rr = length(p);
    float inRing = step(rIn - 10.0, rr) * step(rr, rOut + 10.0);
    o = vec4(0.0, 0.0, 0.0, clamp(sh, 0.0, 0.8) * inRing);
    return;
  }

  float d = sliceDist(p, i);
  float e = 0.75;
  float h = heightAt(p, i);
  float hx = heightAt(p + vec2(e, 0), i) - heightAt(p - vec2(e, 0), i);
  float hy = heightAt(p + vec2(0, e), i) - heightAt(p - vec2(0, e), i);
  vec3 tn = texture(normal, uv).xyz * 2.0 - 1.0;
  vec3 n = normalize(vec3(-hx / (2.0 * e), -hy / (2.0 * e), 1.0) + vec3(tn.x, -tn.y, 0.0) * 0.9);

  vec3 base = texture(albedo, uv).rgb * 1.4 + 0.01;
  float ro = texture(rough, uv).r;
  // The field is dustier and darker, the worn bevel a shade lighter.
  float field = smoothstep(BORDER, BORDER + 2.2, d);
  float bevel = 1.0 - smoothstep(0.0, BEVEL, d);
  base *= mix(1.0, 0.72, field);
  base = mix(base, base * 1.5 + 0.03, bevel * 0.45);

  float diff = max(dot(n, L), 0.0);
  vec3 L2 = normalize(vec3(0.6, -0.55, 0.6));
  float rim = max(dot(n, L2), 0.0);
  vec3 hv = normalize(L + vec3(0, 0, 1));
  float spec = pow(max(dot(n, hv), 0.0), mix(60.0, 8.0, ro)) * (1.0 - ro) * 0.6;
  float ao = mix(0.55, 1.0, smoothstep(0.0, 3.0, d)) * mix(0.82, 1.0, 1.0 - field * (1.0 - smoothstep(BORDER, BORDER + 6.0, d)));

  vec3 col = base * (0.28 + 1.25 * diff * vec3(1.0, 0.92, 0.82) + 0.35 * rim * vec3(0.6, 0.75, 1.0)) * ao + spec * vec3(1.0, 0.95, 0.88);
  if (i == hovered) {
    col *= 1.32;
    col += accent * 0.9 * (1.0 - smoothstep(0.0, 3.0, d));        // a hot rim on the lifted slab
    col += accent * 0.18 * field;                                   // and the rune's glow in its field
  }
  float aa = smoothstep(0.0, 1.0, d);
  o = vec4(col * aa, aa);
}`;

async function load(gl, url, srgb) {
  const img = new Image();
  img.src = url;
  await img.decode();
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, srgb ? gl.SRGB8_ALPHA8 : gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  return t;
}

const ICONS = ["play", "skip-forward", "folder", "camera", "mic-off", "lock", "volume-2", "sparkles", "image", "download", "save", "search", "copy", "monitor", "file-text", "zoom-in"];
const COLORS = ["#4fb3ff", "#ff8a2a", "#ffb02e", "#ffd24a", "#ff8a2a", "#4fb3ff", "#ffd24a", "#ff8a2a"];

async function stage(n, hovered, layout = "even") {
  const wrap = document.createElement("div");
  wrap.className = "stage";
  wrap.innerHTML = `<img class="plate" src="/themes/forge/plate.webp"><canvas></canvas><img class="medallion" src="/themes/forge/medallion.webp">`;
  document.getElementById("row").appendChild(wrap);
  const canvas = wrap.querySelector("canvas");
  canvas.width = canvas.height = SIZE * DPR;
  const gl = canvas.getContext("webgl2", { premultipliedAlpha: true, antialias: true });
  const prog = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VERT], [gl.FRAGMENT_SHADER, FRAG]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(prog, s);
  }
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "pos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tex = [await load(gl, "/themes/forge/stone-albedo.webp", true), await load(gl, "/themes/forge/stone-normal.webp", false), await load(gl, "/themes/forge/stone-rough.webp", false)];
  ["albedo", "normal", "rough"].forEach((name, k) => {
    gl.activeTexture(gl.TEXTURE0 + k);
    gl.bindTexture(gl.TEXTURE_2D, tex[k]);
    gl.uniform1i(gl.getUniformLocation(prog, name), k);
  });
  // Even slices from the top, or a submenu: a gap for the way back at the bottom.
  const starts = [], ends = [];
  const span = layout === "submenu" ? (2 * Math.PI - 0.9) : 2 * Math.PI;
  const from = layout === "submenu" ? Math.PI + 0.45 : -Math.PI / n;
  for (let k = 0; k < n; k++) { starts.push(from + span * k / n); ends.push(from + span * (k + 1) / n); }
  const norm = (a) => ((a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  gl.uniform1fv(gl.getUniformLocation(prog, "starts"), new Float32Array([...starts.map(norm), ...Array(24 - n).fill(0)]));
  gl.uniform1fv(gl.getUniformLocation(prog, "ends"), new Float32Array([...starts.map((s, k) => norm(s) + (ends[k] - starts[k])), ...Array(24 - n).fill(0)]));
  gl.uniform1i(gl.getUniformLocation(prog, "count"), n);
  gl.uniform1i(gl.getUniformLocation(prog, "hovered"), hovered);
  gl.uniform1f(gl.getUniformLocation(prog, "rIn"), R_IN);
  gl.uniform1f(gl.getUniformLocation(prog, "rOut"), R_OUT);
  gl.uniform1f(gl.getUniformLocation(prog, "gap"), GAP);
  gl.uniform1f(gl.getUniformLocation(prog, "half_"), SIZE / 2);
  gl.uniform3f(gl.getUniformLocation(prog, "accent"), 1.0, 0.55, 0.15);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // Runes: the icons, glowing, on each slab's field.
  for (let k = 0; k < n; k++) {
    const a = (starts[k] + ends[k]) / 2, r = (R_IN + R_OUT) / 2;
    const el = document.createElement("div");
    el.className = "icon";
    el.style.left = `${SIZE / 2 + r * Math.sin(a)}px`;
    el.style.top = `${SIZE / 2 - r * Math.cos(a)}px`;
    el.style.setProperty("--c", k === hovered ? "#ffe3a0" : COLORS[k % COLORS.length]);
    el.innerHTML = await (await fetch(`/icons/${ICONS[k % ICONS.length]}.svg`)).text();
    el.querySelector("svg").setAttribute("stroke-width", k === hovered ? "2.6" : "2.2");
    wrap.appendChild(el);
  }
}

await stage(8, 1);
await stage(5, -1);
await stage(12, 4);
await stage(7, 2, "submenu");
document.body.dataset.ready = "1";
</script>
